name: Publish patched Docker image

on:
  push:
    tags:
      - 'patched-v*'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Optional canonical patched-vMAJOR.MINOR.PATCH tag at the selected SHA; empty builds dev-<SHA>'
        required: false
        type: string

permissions:
  contents: read

# Serialize the entire publication, including retries and different tags.
concurrency:
  group: patched-ghcr-publish
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'Egdon/codex2api-inject' && github.event.repository.default_branch == 'main' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/patched-v')))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      upstream_base: ${{ steps.resolve.outputs.upstream_base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate exact candidate
        id: resolve
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
          EVENT_REF: ${{ github.ref }}
        run: |
          source .github/scripts/patched-release-common.sh
          sha=$(git rev-parse 'HEAD^{commit}')
          tag=''
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            tag=${EVENT_REF#refs/tags/}
          else
            [[ "$EVENT_REF" == refs/heads/main ]]
            tag=${BUILD_VERSION:-}
          fi
          if [[ -n "$tag" ]]; then
            canonical_patched_tag "$tag"
            version=$tag
          else
            version="dev-$sha"
          fi
          revalidate_candidate "$sha" "$tag"
          base=$(upstream_base "$sha")
          printf 'sha=%s\nversion=%s\ntag=%s\nupstream_base=%s\n' "$sha" "$version" "$tag" "$base" >> "$GITHUB_OUTPUT"

  ci:
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/pr-check.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}

  publish:
    needs: [candidate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configure required reviewers and restrict deployment refs before enabling.
    environment: patched-publish
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      BUILD_VERSION: ${{ needs.candidate.outputs.version }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      UPSTREAM_BASE: ${{ needs.candidate.outputs.upstream_base }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate candidate after environment approval
        run: |
          source .github/scripts/patched-release-common.sh
          revalidate_candidate "$CANDIDATE_SHA" "$RELEASE_TAG"
          printf 'IMAGE=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse immutable full-SHA image if already published
        id: immutable
        run: |
          set -euo pipefail
          if digest=$(docker buildx imagetools inspect "$IMAGE:sha-$CANDIDATE_SHA" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            # A pre-existing dev image must never masquerade as this release.
            for platform in linux/amd64 linux/arm64; do
              docker pull --platform "$platform" "$IMAGE@$digest" >/dev/null
              docker image inspect "$IMAGE@$digest" | jq -e \
                --arg version "$BUILD_VERSION" --arg revision "$CANDIDATE_SHA" \
                --arg base "$UPSTREAM_BASE" \
                '.[0].Config.Labels | .["org.opencontainers.image.version"] == $version and .["org.opencontainers.image.revision"] == $revision and .["io.codex2api.build-source"] == "patched" and .["io.codex2api.upstream-base"] == $base' >/dev/null
            done
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
            printf 'Image does not exist yet; building once.\n'
          else
            printf 'Registry inspection failed; refusing to overwrite an unknown tag.\n' >&2
            exit 1
          fi
      - name: Build and push immutable image
        id: build
        if: steps.immutable.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ needs.candidate.outputs.sha }}
          build-args: |
            BUILD_VERSION=${{ needs.candidate.outputs.version }}
            BUILD_SOURCE=patched
            BUILD_UPSTREAM_BASE=${{ needs.candidate.outputs.upstream_base }}
            BUILD_REVISION=${{ needs.candidate.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}
            io.codex2api.build-source=patched
            io.codex2api.upstream-base=${{ needs.candidate.outputs.upstream_base }}
          provenance: false
      - name: Promote the same digest only while candidate is main HEAD
        env:
          DIGEST: ${{ steps.immutable.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          source .github/scripts/patched-release-common.sh
          revalidate_candidate "$CANDIDATE_SHA" "$RELEASE_TAG"
          # Last remote operation before promotion: an older queued run cannot
          # replace stable after main has advanced. No rebuild and no latest tag.
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$CANDIDATE_SHA" ]]; then
            printf 'Main moved; immutable image kept, patched-stable not changed.\n'
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:patched-stable" "$IMAGE@$DIGEST"
          promoted=$(docker buildx imagetools inspect "$IMAGE:patched-stable" --format '{{.Manifest.Digest}}')
          [[ "$promoted" == "$DIGEST" ]]
