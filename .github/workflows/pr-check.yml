name: CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact commit to check for publishing
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_sha || 'event' }}
  cancel-in-progress: true

jobs:
  admin-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check extracted admin JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('admin/inject_page.go', 'utf8');
          const scripts = [...source.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected exactly one admin script');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/admin-inject.js`, scripts[0][1]);
          NODE
          node --check "$RUNNER_TEMP/admin-inject.js"
      - name: Test admin JavaScript against checked-out Go source
        run: node --test admin/inject_page_js.test.mjs

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: BUILD_VERSION=ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Install Chromium for SVG export regression tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test SVG export in the browser
        working-directory: frontend
        run: npm run test:svg

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.head_ref || github.ref_name }}
        run: npm run build

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --enable-only=govet --timeout=10m ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run Go tests
        run: go test -count=1 -timeout 8m ./...

  postgres-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codex2api_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codex2api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex2api_test -d codex2api_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test PostgreSQL trace, indexes, capabilities and legacy daily usage
        env:
          CODEX2API_TEST_POSTGRES_DSN: postgres://codex2api_test:test-only@localhost:5432/codex2api_test?sslmode=disable
        run: go test -race -count=1 ./database -run '^TestPostgresTraceAndCapabilities$'

  test-race:
    name: test-race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy-a-g
          - name: proxy-h-z
          - name: admin
          - name: database
          - name: promptfilter
          - name: rest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      # 重包各占一台 2 核 runner,避免互相抢核。分片大小见 go-race-packages.sh:
      # 测试建库走 SQLite schema 模板(database.PrepareSQLiteSchemaTemplate)后,
      # admin/database 整包 -race 都在 1 分钟量级;proxy 是最重的包,按测试名首字母拆两片。
      - name: Run Go tests with race detector
        run: |
          set -euo pipefail
          args="$(bash .github/scripts/go-race-packages.sh '${{ matrix.name }}')"
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 12m $args
