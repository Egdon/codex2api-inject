name: Sync stable upstream release

on:
  schedule:
    # 03:23 Asia/Shanghai (UTC+8), on the following local calendar day.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    # Never execute the PAT-bearing job from a manually selected feature branch.
    if: github.repository != 'james-6-23/codex2api' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Merge latest stable release and propose review
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/sync-upstream-release.sh
